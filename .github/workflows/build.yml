name: Build

on: 
  push:
    paths-ignore:
    - 'README.md'
  pull_request:
    paths-ignore:
    - 'README.md'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Dotnet
      uses: actions/setup-dotnet@v6

    - name: Build
      run: .\build.cmd